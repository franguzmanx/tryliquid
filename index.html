<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Video + Leverage</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="scroll-container">
        <div class="sticky-wrapper">
            <!-- Video canvas (fondo) -->
            <canvas id="video-canvas"></canvas>

            <!-- Texto leverage (encima del video) -->
            <div class="leverage-overlay">
                <div class="title-container">
                    <div class="title-line">With leverage,</div>
                    <div class="title-line">
                        <span class="faded">Your </span>
                        <span>$100 </span>
                        <span class="faded">becomes </span>
                        <span id="amount">$100</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
