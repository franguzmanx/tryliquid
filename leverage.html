<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leverage Scroll</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        body::-webkit-scrollbar {
            display: none;
        }
        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .scroll-container {
            height: 300vh;
            position: relative;
        }
        .sticky-content {
            position: sticky;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .content-wrapper {
            width: 100%;
            max-width: 900px;
            padding: 48px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            align-items: center;
        }
        .title-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .title-line {
            font-size: 64px;
            line-height: 1.06;
            font-weight: 600;
            letter-spacing: -0.07em;
            text-align: center;
            font-variant-numeric: tabular-nums;
            -webkit-font-smoothing: antialiased;
            white-space: nowrap;
            color: #000;
        }
        .faded {
            opacity: 0.5;
        }
        #amount {
            display: inline-block;
            min-width: 4ch;
        }
        @media (max-width: 768px) {
            .title-line {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="scroll-container" id="container">
        <div class="sticky-content">
            <div class="content-wrapper">
                <div class="title-container">
                    <div class="title-line">With leverage,</div>
                    <div class="title-line">
                        <span class="faded">Your </span>
                        <span>$100 </span>
                        <span class="faded">becomes </span>
                        <span id="amount">$100</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            baseAmount: 100,
            maxAmount: 5000,
            currencySymbol: '$'
        };

        function formatCurrency(n) {
            const rounded = Math.round(n);
            return CONFIG.currencySymbol + rounded.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function getScrollProgress() {
            const container = document.getElementById('container');
            const rect = container.getBoundingClientRect();
            const containerHeight = rect.height - window.innerHeight;
            const scrolled = Math.max(0, -rect.top);
            const progress = containerHeight > 0 ? scrolled / containerHeight : 0;
            return Math.min(Math.max(progress, 0), 1);
        }

        function updateAmount() {
            const progress = getScrollProgress();
            const amount = CONFIG.baseAmount + progress * (CONFIG.maxAmount - CONFIG.baseAmount);
            document.getElementById('amount').textContent = formatCurrency(amount);
        }

        window.addEventListener('scroll', updateAmount);
        updateAmount();
    </script>
</body>
</html>
